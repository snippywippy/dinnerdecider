<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5C94FC">
<title>Dinner Decider</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#5C94FC; --bg-raised:#FCFCFC; --butter:#FBD000; --cream:#FCFCFC;
    --cream-dim:#e7f0ff; --rust:#E4000F; --sage:#00A81A; --line:#101010;
    --ink:#101010; --ink-dim:#4a4a4a;
    --radius: 0px;
    --shadow: 4px 4px 0 var(--ink);
    --shadow-sm: 3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'VT323', monospace; font-size:19px; -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
    background-image:
      linear-gradient(rgba(255,255,255,0.08) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,0.08) 2px, transparent 2px);
    background-size: 24px 24px;
  }
  .app{max-width:480px; margin:0 auto; min-height:100vh; padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); display:flex; flex-direction:column;}
  h1,h2,h3{font-family:'Press Start 2P', monospace; font-weight:400; margin:0 0 10px; letter-spacing:0; color:var(--cream); text-shadow: 3px 3px 0 var(--ink);}
  h1{font-size:22px; line-height:1.4;}
  h2{font-size:14px; line-height:1.5; color:var(--ink); text-shadow:none;}
  h3{font-size:12px; line-height:1.5; color:var(--ink); text-shadow:none;}
  .sub{color:var(--cream-dim); font-size:16px; margin:0 0 18px; line-height:1.5; text-shadow: 2px 2px 0 var(--ink);}
  .card .sub{color:var(--ink-dim); text-shadow:none;}
  .tabs{display:flex; gap:0; background:var(--ink); border:3px solid var(--ink); border-radius:0; padding:4px; margin-bottom:22px; box-shadow:var(--shadow);}
  .tab{flex:1; text-align:center; padding:11px 4px; border-radius:0; font-family:'Press Start 2P', monospace; font-size:10px; font-weight:400; color:var(--cream); cursor:pointer; user-select:none; transition:background .1s, color .1s;}
  .tab.active{background:var(--butter); color:var(--ink);}
  .screen{display:none; flex-direction:column;}
  .screen.active{display:flex;}
  .card{background:var(--bg-raised); border:3px solid var(--ink); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .place-name{font-size:17px; font-weight:700; color:var(--ink);}
  .place-meta{font-size:13px; color:var(--ink-dim); margin-top:5px; display:flex; gap:6px; flex-wrap:wrap;}
  .chip{display:inline-block; padding:3px 8px; border-radius:0; border:2px solid var(--ink); font-size:12px; color:var(--ink); background:var(--cream-dim);}
  button{font-family:inherit; border:none; cursor:pointer; background:none; color:inherit;}
  .btn{background:var(--butter); color:var(--ink); font-family:'Press Start 2P', monospace; font-weight:400; font-size:13px; padding:15px 18px; border:3px solid var(--ink); border-radius:var(--radius); width:100%; text-align:center; box-shadow:var(--shadow-sm); transition:transform .05s, box-shadow .05s;}
  .btn:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--ink);}
  .btn:disabled{opacity:0.45; pointer-events:none;}
  .btn.ghost{background:var(--bg-raised); border:3px solid var(--ink); color:var(--ink); font-weight:400;}
  .btn.small{width:auto; padding:10px 14px; font-size:11px;}
  .btn.danger{background:var(--rust); color:var(--cream); border:3px solid var(--ink);}
  input, select{font-family:'VT323', monospace; font-size:18px; background:var(--bg-raised); border:3px solid var(--ink); color:var(--ink); border-radius:0; padding:10px 12px; width:100%;}
  input::placeholder{color:var(--ink-dim);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:13px; color:var(--ink-dim); margin-bottom:5px; font-family:'Press Start 2P', monospace; font-size:9px; letter-spacing:0.02em;}
  .field-row{display:flex; gap:8px; align-items:flex-end;}
  .field-row .field{flex:1; margin-bottom:12px;}
  .icon-btn{width:30px; height:30px; border-radius:0; display:flex; align-items:center; justify-content:center; font-size:16px; border:2px solid var(--ink); color:var(--ink); background:var(--bg-raised); flex-shrink:0;}
  .icon-btn.remove:active{background:var(--rust); color:var(--cream);}
  .empty{text-align:center; color:var(--ink-dim); font-size:16px; padding:36px 20px; line-height:1.6;}
  .maplink{display:inline-block; font-size:13px; color:#1a73e8; text-decoration:underline; margin-top:6px;}
  .drive-cat-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .drive-cat-cluster{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .spot-name-col{flex:1; text-align:center; min-width:0;}
  .spot-name-col .place-name{font-size:19px;}
  .drive-time-lg{font-family:'Press Start 2P', monospace; font-size:15px; color:var(--ink); text-align:right; line-height:1.35;}
  .drive-time-lg .drive-time-unit{display:block; font-size:8px; color:var(--ink-dim); margin-top:2px; letter-spacing:0.03em;}
  .cat-badge{width:68px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; border:3px solid var(--ink); background:var(--cream-dim); padding:5px 3px; box-shadow:var(--shadow-sm);}
  .cat-icon{font-size:24px; line-height:1;}
  .cat-label{font-family:'Press Start 2P', monospace; font-size:6.5px; letter-spacing:0; margin-top:4px; text-align:center; line-height:1; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .divider{border:0; border-top:3px solid var(--ink); margin:22px 0;}
  .status{font-size:14px; color:var(--sage); margin-top:8px; line-height:1.4;}
  .status.error{color:var(--rust);}
  .settings-toggle{font-size:14px; color:var(--cream); text-decoration:none; border-bottom:2px dotted var(--cream); margin-bottom:14px; display:inline-block; text-shadow:2px 2px 0 var(--ink);}
  .edit-form{margin-top:12px; padding-top:12px; border-top:2px dashed var(--ink);}
  .checklist-item{display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:2px dashed var(--ink);}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item input[type=checkbox]{width:20px; height:20px; margin-top:3px; accent-color:var(--sage);}
  .checklist-item select{width:auto; font-size:14px; padding:5px 8px; margin-top:6px;}

  .people-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .person-pill{padding:9px 14px; border-radius:0; border:3px solid var(--ink); background:var(--bg-raised); color:var(--ink); font-weight:700; font-size:15px; display:flex; align-items:center; gap:6px; box-shadow:var(--shadow-sm);}
  .person-pill.selected{background:var(--sage); border-color:var(--ink); color:var(--cream);}

  .voter-block{margin-bottom:20px;}
  .voter-name{font-size:12px; font-family:'Press Start 2P', monospace; color:var(--butter); text-shadow:2px 2px 0 var(--ink); margin-bottom:10px;}
  .vote-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:2px dashed var(--ink);}
  .vote-row .place-name{font-size:15px;}
  .vote-row:last-child{border-bottom:none;}
  .vote-controls{display:flex; gap:6px; flex-shrink:0;}
  .vbtn{width:36px; height:36px; border-radius:0; border:2px solid var(--ink); font-size:15px; display:flex; align-items:center; justify-content:center; background:var(--bg-raised); color:var(--ink);}
  .vbtn.vote-on{background:var(--sage); border-color:var(--ink); color:var(--cream);}
  .vbtn.veto-on{background:var(--rust); border-color:var(--ink); color:var(--cream);}

  .spin-stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 0;}
  .slot-frame{background:linear-gradient(180deg,#3a0ca3,#20063b); border:4px solid var(--butter); border-radius:0; padding:14px; width:100%; box-shadow:0 0 0 4px var(--ink), 0 0 22px 5px rgba(251,208,0,0.55);}
  .slot-lights{display:flex; justify-content:space-between; padding:0 2px 10px;}
  .slot-light{width:9px; height:9px; border-radius:50%; background:var(--rust); box-shadow:0 0 6px 1px var(--rust); animation:marquee 1s infinite;}
  .slot-light:nth-child(3n+1){background:var(--butter); box-shadow:0 0 6px 1px var(--butter); animation-delay:.1s;}
  .slot-light:nth-child(3n+2){background:var(--sage); box-shadow:0 0 6px 1px var(--sage); animation-delay:.25s;}
  @keyframes marquee{0%,100%{opacity:0.25;} 50%{opacity:1;}}
  .ticket{background:repeating-linear-gradient(180deg, #0d0d0d 0px, #0d0d0d 2px, #161616 2px, #161616 4px); border:3px solid var(--ink); border-radius:0; padding:28px 18px; width:100%; position:relative; box-shadow:inset 0 0 0 2px var(--butter);}
  .ticket .label{font-family:'Press Start 2P', monospace; font-size:10px; letter-spacing:0.02em; color:var(--butter); margin-bottom:14px; text-shadow:1px 1px 0 var(--ink);}
  .ticket .winner-name{font-family:'VT323', monospace; font-size:34px; font-weight:700; line-height:1.2; min-height:74px; display:flex; align-items:center; justify-content:center; color:var(--butter); background:var(--ink); border:2px solid var(--butter); padding:6px 10px; text-shadow:2px 2px 0 rgba(228,0,15,0.6);}
  .winner-meta{color:var(--cream-dim); font-size:16px; margin-top:14px; text-shadow:1px 1px 0 var(--ink);}
  .spin-actions{width:100%; margin-top:22px; display:flex; flex-direction:column; gap:10px;}
  @keyframes reelspin{0%{transform:translateY(-5px); filter:blur(1.5px);} 50%{transform:translateY(0); filter:blur(0);} 100%{transform:translateY(5px); filter:blur(1.5px);}}
  .spinning{animation:reelspin .09s linear infinite;}
  .spinner-dot{display:inline-block; width:8px; height:8px; border-radius:0; background:var(--butter); margin:0 3px; animation:marquee .5s infinite;}
  .handoff-card{text-align:center; padding:40px 22px;}
  .handoff-card .avatar.xl{width:88px; margin-bottom:14px;}
  .voter-progress{font-family:'Press Start 2P', monospace; font-size:9px; color:var(--cream-dim); text-shadow:2px 2px 0 var(--ink); margin-bottom:10px;}
  .back-link{display:inline-block; font-size:14px; color:var(--cream); text-decoration:underline; margin-bottom:12px; text-shadow:2px 2px 0 var(--ink);}
  .hero-sprite{display:block; margin:0 auto 10px; width:56%; max-width:220px; height:auto; image-rendering:pixelated; image-rendering:crisp-edges;}
  .avatar{width:24px; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; flex-shrink:0;}
  .avatar.lg{width:38px;}
  .person-pill{align-items:center;}
  .app-footer{display:flex; gap:8px; padding-top:2px;}
  .app-footer .btn{width:auto; flex:1; font-size:10px; padding:12px 8px;}
</style>
</head>
<body>
<div class="app">
  <img src="/couple-sprite.png" alt="" class="hero-sprite">
  <h1 style="text-align:center;">Dinner Decider</h1>
  <p class="sub">Vote, veto, spin. No more circling for twenty minutes.</p>

  <div class="tabs">
    <div class="tab active" data-tab="round">Tonight</div>
    <div class="tab" data-tab="places">Spots</div>
    <div class="tab" data-tab="people">People</div>
  </div>

  <div class="screen active" id="screen-round"><div id="round-body"></div></div>

  <div class="screen" id="screen-places">
    <div id="places-tab-body"></div>
  </div>

  <div class="screen" id="screen-people">
    <h2>People</h2>
    <p class="sub">Whoever might vote on any given night.</p>
    <div id="people-manage-list"></div>
    <div class="field" style="margin-top:16px;">
      <label>Add a person</label>
      <div class="field-row">
        <input id="person-name" placeholder="Name">
        <button class="btn small" id="add-person-btn">Add</button>
      </div>
    </div>
  </div>

  <hr class="divider" style="margin-top:30px;">
  <div class="app-footer">
    <button class="btn ghost small" id="refresh-app-btn">&#8635; Refresh app</button>
    <button class="btn danger small" id="clear-spots-btn">Clear all spots</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'where-to-v3';

function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try { return migrate(JSON.parse(raw)); } catch(e){} }
  return {
    places: [],
    people: [ { id: uid(), name: 'Austin' }, { id: uid(), name: 'Annahita' } ],
    settings: { homeLabel:'', homeLat:null, homeLng:null, radiusMiles: 8 },
    round: { selectedPeople: [], votes: {}, vetoes: {} }
  };
}
const PLACEHOLDER_PLACE_NAMES = new Set([
  'mesa taqueria', 'green bowl kitchen', "otto's fish camp", 'pinewood bbq', 'corner pizza co.'
]);
function migrate(s){
  if(!s.settings) s.settings = { homeLabel:'', homeLat:null, homeLng:null, radiusMiles: 8 };
  if(!s.people || s.people.length === 0){
    s.people = [ { id: uid(), name: 'Austin' }, { id: uid(), name: 'Annahita' } ];
  }
  if(s.places){
    s.places = s.places.filter(p => !PLACEHOLDER_PLACE_NAMES.has((p.name||'').trim().toLowerCase()));
  }
  if(!s.round) s.round = { selectedPeople: [], votes: {}, vetoes: {} };
  if(!s.round.votes) s.round.votes = {};
  if(!s.round.vetoes) s.round.vetoes = {};
  // Older saves stored one veto per person as a single placeId string — normalize to arrays.
  Object.keys(s.round.vetoes).forEach(pid=>{
    const v = s.round.vetoes[pid];
    if(v && !Array.isArray(v)) s.round.vetoes[pid] = [v];
  });
  return s;
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
let state = loadState();
function uid(){ return Math.random().toString(36).slice(2,9); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function avatarForName(name){
  const n = (name||'').trim().toLowerCase();
  if(n === 'austin') return '/austin-sprite.png';
  if(n === 'annahita') return '/annahita-sprite.png';
  return '/generic-sprite.png';
}

// ---------- Tabs ----------
function switchToTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id === 'screen-' + name));
  if(name === 'round') renderRound();
  if(name === 'places') renderPlacesTab();
  if(name === 'people') renderPeopleManage();
}
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=> switchToTab(tab.dataset.tab));
});

// ---------- Server-side geocoding / places (API key lives on the server, never in the browser) ----------
async function geocodeAddress(address){
  const res = await fetch('/api/geocode?address=' + encodeURIComponent(address));
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Could not locate that address');
  return data; // { lat, lng, formatted }
}
async function nearbySearchAll(lat, lng, radiusMiles){
  const res = await fetch(`/api/nearby?lat=${lat}&lng=${lng}&radiusMiles=${radiusMiles}`);
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Search failed');
  return data.results; // array shaped like Google's Places REST response
}
async function findPlaceByName(query){
  const res = await fetch('/api/findplace?query=' + encodeURIComponent(query));
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'No match found');
  return data; // { name, formatted_address, lat, lng, price_level, types }
}

// ---------- Geolocation ----------
function locateUser(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error('Location is not available in this browser.')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      err => reject(new Error(err.message || 'Could not get your location.')),
      { timeout: 10000 }
    );
  });
}

// ---------- Distance / guessing helpers ----------
function haversineMiles(lat1, lng1, lat2, lng2){
  const R = 3958.8;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function estimateMinutes(miles){
  // rough: assumes a mix of surface roads, ~30mph average, plus a small base for parking/lights
  return Math.max(4, Math.round((miles / 30) * 60 + 3));
}
function mapPriceLevel(level){
  if(level === undefined || level === null) return 2;
  if(level <= 1) return 1;
  if(level === 2) return 2;
  return 3;
}
function guessHealth(name, types){
  const text = (name + ' ' + (types||[]).join(' ')).toLowerCase();
  const light = ['sushi','salad','poke','vegan','vegetarian','juice','smoothie','mediterranean','seafood','sashimi'];
  const indulgent = ['bbq','barbecue','steak','pizza','burger','fried','buffet','ice_cream','bakery','donut','wing','fast_food'];
  if(light.some(k=>text.includes(k))) return 'light';
  if(indulgent.some(k=>text.includes(k))) return 'indulgent';
  return 'moderate';
}

function guessCategory(name, types){
  const n = (name||'').toLowerCase();
  const t = (types||[]).map(x=>x.toLowerCase());
  const has = (...kws) => kws.some(k=>n.includes(k));
  if(has('taco','mexican','cantina','margarita','burrito','taqueria','tex-mex','tex mex')) return 'Mexican';
  if(has('olive garden','italian','trattoria','ristorante','pasta')) return 'Italian';
  if(has('pizza')) return 'Pizza';
  if(has('sushi','ramen','japanese','hibachi','izakaya')) return 'Japanese';
  if(has('thai')) return 'Thai';
  if(has('chinese','wok','panda express')) return 'Chinese';
  if(has('indian','curry','tandoor')) return 'Indian';
  if(has('vietnamese','pho ')) return 'Vietnamese';
  if(has('mediterranean','greek','gyro','kabob','kebab','falafel')) return 'Mediterranean';
  if(has('bbq','barbeque','barbecue','smokehouse','smoke house')) return 'BBQ';
  if(has('steak','steakhouse','chophouse','chop house')) return 'Steakhouse';
  if(has('seafood','oyster','crab','shrimp','fish camp','fish house')) return 'Seafood';
  if(has('burger')) return 'Burgers';
  if(has('brewery','brewing','brewhouse','brew house','taproom')) return 'Brewery';
  if(has('cracker barrel','breakfast','brunch','pancake','waffle')) return 'Breakfast';
  if(has('bakery','patisserie')) return 'Bakery';
  if(has('vegan','vegetarian')) return 'Vegetarian';
  if(has('wing')) return 'Wings';
  if(has('deli','sandwich')) return 'Deli';
  if(t.includes('bar')||has('pub','tavern','saloon','grill')) return 'Bar & Grill';
  return 'American';
}

const CATEGORY_ICONS = {
  'Mexican': '\ud83c\udf2e', 'Italian': '\ud83c\udf5d', 'Pizza': '\ud83c\udf55',
  'Japanese': '\ud83c\udf63', 'Thai': '\ud83c\udf5c', 'Chinese': '\ud83e\udd61',
  'Indian': '\ud83c\udf5b', 'Vietnamese': '\ud83c\udf5c', 'Mediterranean': '\ud83e\udd59',
  'BBQ': '\ud83c\udf56', 'Steakhouse': '\ud83e\udd69', 'Seafood': '\ud83e\udd90',
  'Burgers': '\ud83c\udf54', 'Brewery': '\ud83c\udf7a', 'Breakfast': '\ud83e\udd5e',
  'Bakery': '\ud83e\uddc1', 'Vegetarian': '\ud83e\udd57', 'Wings': '\ud83c\udf57',
  'Deli': '\ud83e\udd6a', 'Bar & Grill': '\ud83c\udf7b', 'American': '\ud83c\udf7d\ufe0f'
};
const CATEGORY_SHORT = {
  'Mexican': 'MEXICAN', 'Italian': 'ITALIAN', 'Pizza': 'PIZZA',
  'Japanese': 'JAPAN', 'Thai': 'THAI', 'Chinese': 'CHINESE',
  'Indian': 'INDIAN', 'Vietnamese': 'VIETNAM', 'Mediterranean': 'MEDITER',
  'BBQ': 'BBQ', 'Steakhouse': 'STEAK', 'Seafood': 'SEAFOOD',
  'Burgers': 'BURGERS', 'Brewery': 'BREWERY', 'Breakfast': 'BRKFAST',
  'Bakery': 'BAKERY', 'Vegetarian': 'VEGGIE', 'Wings': 'WINGS',
  'Deli': 'DELI', 'Bar & Grill': 'GRILL', 'American': 'AMERICAN'
};
function categoryBadge(category){
  const emoji = CATEGORY_ICONS[category] || '\ud83c\udf7d\ufe0f';
  const label = CATEGORY_SHORT[category] || (category||'').toUpperCase().slice(0, 9);
  return `<div class="cat-badge"><div class="cat-icon">${emoji}</div><div class="cat-label">${escapeHtml(label)}</div></div>`;
}

function mapsLinkForPlace(p){
  if(!p || !p.placeId) return null;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name || '')}&query_place_id=${encodeURIComponent(p.placeId)}`;
}

async function fetchDriveTimes(originLat, originLng, destinations){
  if(!destinations || destinations.length === 0) return [];
  const destStr = destinations.map(d=>`${d.lat},${d.lng}`).join(';');
  const res = await fetch(`/api/drivetime?originLat=${originLat}&originLng=${originLng}&destinations=${encodeURIComponent(destStr)}`);
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Drive time lookup failed');
  return data.results; // aligned with destinations: {minutes, miles} or null per entry
}

// ---------- Places tab (settings + list + import + manual add) ----------
let showSettings = false;
let importResults = null; // {results: [...], checked:Set}
let importStatus = '';
let importLoading = false;
let lastLookupPlaceId = null;
let lastLookupName = null;
let lastLookupPrice = 2;
let lastLookupHealth = 'moderate';

async function findNearbyRestaurants(){
  if(!state.settings.homeLat){
    importStatus = 'Error: save your home base above first.';
    renderPlacesTab();
    return;
  }
  importStatus = 'Searching nearby restaurants...';
  importResults = null;
  renderPlacesTab();
  try{
    const results = await nearbySearchAll(state.settings.homeLat, state.settings.homeLng, state.settings.radiusMiles);
    const existingNames = new Set(state.places.map(p=>p.name.toLowerCase()));
    const filtered = results.filter(r => !existingNames.has((r.name||'').toLowerCase()));
    const mapped = filtered.map(r=>({
      placeId: r.place_id,
      name: r.name,
      category: guessCategory(r.name, r.types),
      lat: r.geometry.location.lat,
      lng: r.geometry.location.lng,
      price: mapPriceLevel(r.price_level),
      health: guessHealth(r.name, r.types),
      distance: estimateMinutes(haversineMiles(state.settings.homeLat, state.settings.homeLng, r.geometry.location.lat, r.geometry.location.lng)),
      checked: true
    }));
    mapped.sort((a,b)=>a.distance-b.distance);
    importResults = { results: mapped };
    importStatus = mapped.length === 0
      ? 'No new restaurants found in range — try a wider radius.'
      : `Found ${mapped.length} spot${mapped.length===1?'':'s'}. Uncheck any you don't want, then add.`;
    renderPlacesTab();
    if(mapped.length > 0){
      try{
        const driveTimes = await fetchDriveTimes(state.settings.homeLat, state.settings.homeLng, mapped.map(m=>({lat:m.lat, lng:m.lng})));
        driveTimes.forEach((dt, i)=>{ if(dt) mapped[i].distance = dt.minutes; });
        mapped.sort((a,b)=>a.distance-b.distance);
        renderImportResults();
      } catch(err){
        importStatus += ` (drive times unavailable: ${err.message} — showing rough estimates)`;
        renderPlacesTab();
      }
    }
  } catch(err){
    importStatus = 'Error: ' + err.message;
    renderPlacesTab();
  }
}

function renderPlacesList(){
  const mount = document.getElementById('places-list-mount');
  if(!mount) return;
  if(state.places.length === 0){
    mount.innerHTML = '<div class="empty">No spots yet. Add one below, or set up the import.</div>';
    return;
  }
  const sorted = [...state.places].sort((a,b)=>a.distance-b.distance);
  mount.innerHTML = sorted.map(p=>{
    const lastVisited = p.lastVisited ? daysAgoLabel(p.lastVisited) : 'Never logged';
    return `<div class="card" data-place-card="${p.id}">
      <div class="row" data-expand-place="${p.id}" style="cursor:pointer; align-items:center;">
        <div class="drive-time-lg">${p.distance}<span class="drive-time-unit">min</span></div>
        <div class="spot-name-col">
          <div class="place-name">${escapeHtml(p.name)}</div>
          <div class="place-meta" style="justify-content:center;"><span class="chip">${lastVisited}</span></div>
          ${p.placeId ? `<a class="maplink" href="${mapsLinkForPlace(p)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">View on Google Maps</a>` : ''}
        </div>
        ${categoryBadge(guessCategory(p.name))}
        <button class="icon-btn remove" data-remove-place="${p.id}">&times;</button>
      </div>
      ${p._editing ? `
        <div class="edit-form">
          <div class="field"><label>Drive (minutes)</label><input type="number" class="edit-distance" data-edit-id="${p.id}" value="${p.distance}"></div>
          <button class="btn small" data-save-edit="${p.id}">Save</button>
        </div>
      ` : ''}
    </div>`;
  }).join('');

  mount.querySelectorAll('[data-remove-place]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      state.places = state.places.filter(p=>p.id !== btn.dataset.removePlace);
      saveState(); renderPlacesList();
    });
  });
  mount.querySelectorAll('[data-expand-place]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const id = row.dataset.expandPlace;
      const p = state.places.find(p=>p.id===id);
      if(p) p._editing = !p._editing;
      renderPlacesList();
    });
  });
  mount.querySelectorAll('[data-save-edit]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.dataset.saveEdit;
      const p = state.places.find(p=>p.id===id);
      if(!p) return;
      const distEl = mount.querySelector(`.edit-distance[data-edit-id="${id}"]`);
      p.distance = parseInt(distEl.value, 10) || p.distance;
      p._editing = false;
      saveState(); renderPlacesList();
    });
  });
}

function daysAgoLabel(iso){
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if(days <= 0) return 'Today';
  if(days === 1) return '1 day ago';
  if(days < 30) return days + ' days ago';
  const months = Math.floor(days/30);
  return months === 1 ? '1 month ago' : months + ' months ago';
}

function attachPlacesTabHandlers(){
  const toggle = document.getElementById('toggle-settings');
  if(toggle) toggle.addEventListener('click', ()=>{ showSettings = !showSettings; renderPlacesTab(); });

  const saveHomeBtn = document.getElementById('save-home-btn');
  if(saveHomeBtn) saveHomeBtn.addEventListener('click', async ()=>{
    const address = document.getElementById('home-address').value.trim();
    const statusEl = document.getElementById('home-status');
    if(!address){ statusEl.textContent = 'Enter an address.'; statusEl.classList.add('error'); return; }
    statusEl.classList.remove('error');
    statusEl.textContent = 'Locating...';
    try{
      const loc = await geocodeAddress(address);
      state.settings.homeLabel = loc.formatted;
      state.settings.homeLat = loc.lat;
      state.settings.homeLng = loc.lng;
      saveState();
      statusEl.textContent = `Located: ${loc.formatted}`;
      await findNearbyRestaurants();
    } catch(err){
      statusEl.textContent = 'Error: ' + err.message;
      statusEl.classList.add('error');
    }
  });

  const findNearbyBtn = document.getElementById('find-nearby-btn');
  if(findNearbyBtn) findNearbyBtn.addEventListener('click', ()=>{
    const radiusInput = document.getElementById('radius-miles');
    state.settings.radiusMiles = parseFloat(radiusInput.value) || 8;
    saveState();
    findNearbyRestaurants();
  });

  const useLocationBtn = document.getElementById('use-location-btn');
  if(useLocationBtn) useLocationBtn.addEventListener('click', async ()=>{
    const statusEl = document.getElementById('home-status');
    statusEl.classList.remove('error');
    statusEl.textContent = 'Finding your location...';
    try{
      const loc = await locateUser();
      state.settings.homeLat = loc.lat;
      state.settings.homeLng = loc.lng;
      state.settings.homeLabel = 'Current location';
      saveState();
      document.getElementById('home-address').value = '';
      statusEl.textContent = 'Located: current location';
      await findNearbyRestaurants();
    } catch(err){
      statusEl.textContent = 'Error: ' + err.message;
      statusEl.classList.add('error');
    }
  });

  const lookupBtn = document.getElementById('lookup-btn');
  if(lookupBtn) lookupBtn.addEventListener('click', async ()=>{
    const nameEl = document.getElementById('p-name');
    const statusEl = document.getElementById('lookup-status');
    const name = nameEl.value.trim();
    if(!name){ nameEl.focus(); return; }
    if(!state.settings.homeLat){
      statusEl.textContent = 'Set up home base above first.';
      statusEl.classList.add('error');
      return;
    }
    statusEl.classList.remove('error');
    statusEl.textContent = 'Looking up...';
    try{
      const query = `${name} near ${state.settings.homeLabel}`;
      const place = await findPlaceByName(query);
      const miles = haversineMiles(state.settings.homeLat, state.settings.homeLng, place.lat, place.lng);
      document.getElementById('p-distance').value = estimateMinutes(miles);
      lastLookupPrice = mapPriceLevel(place.price_level);
      lastLookupHealth = guessHealth(place.name, place.types);
      nameEl.value = place.name;
      lastLookupPlaceId = place.place_id || null;
      lastLookupName = place.name;
      statusEl.textContent = `Matched: ${place.formatted_address}`;
      try{
        const driveTimes = await fetchDriveTimes(state.settings.homeLat, state.settings.homeLng, [{lat: place.lat, lng: place.lng}]);
        if(driveTimes[0]) document.getElementById('p-distance').value = driveTimes[0].minutes;
      } catch(e){ /* keep the rough estimate already filled in */ }
    } catch(err){
      statusEl.textContent = 'Error: ' + err.message;
      statusEl.classList.add('error');
    }
  });

  const addBtn = document.getElementById('add-place-btn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const name = document.getElementById('p-name').value.trim();
    const distance = parseInt(document.getElementById('p-distance').value, 10);
    if(!name){ document.getElementById('p-name').focus(); return; }
    const matched = lastLookupName === name;
    const placeId = matched ? lastLookupPlaceId : null;
    const price = matched ? lastLookupPrice : 2;
    const health = matched ? lastLookupHealth : 'moderate';
    state.places.push({ id: uid(), name, distance: isNaN(distance) ? 15 : distance, price, health, lastVisited: null, placeId });
    lastLookupPlaceId = null; lastLookupName = null; lastLookupPrice = 2; lastLookupHealth = 'moderate';
    saveState();
    document.getElementById('p-name').value = '';
    document.getElementById('p-distance').value = '';
    document.getElementById('lookup-status').textContent = '';
    renderPlacesList();
  });
}

function renderImportResults(){
  const mount = document.getElementById('import-results-mount');
  if(!mount) return;
  if(!importResults || importResults.results.length === 0){ mount.innerHTML = ''; return; }
  const checkedCount = importResults.results.filter(r=>r.checked).length;
  mount.innerHTML = `
    <div style="margin-top:10px;">
      ${importResults.results.map((r,i)=>`
        <div class="checklist-item">
          <input type="checkbox" data-import-check="${i}" ${r.checked?'checked':''}>
          <div class="drive-time-lg">${r.distance}<span class="drive-time-unit">min</span></div>
          <div class="spot-name-col">
            <div class="place-name">${escapeHtml(r.name)}</div>
            ${r.placeId ? `<a class="maplink" href="${mapsLinkForPlace(r)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">View on Google Maps</a>` : ''}
          </div>
          ${categoryBadge(r.category)}
        </div>
      `).join('')}
    </div>
    <button class="btn" id="add-checked-btn" style="margin-top:12px;">Add ${checkedCount} spot${checkedCount===1?'':'s'}</button>
  `;
  mount.querySelectorAll('[data-import-check]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      importResults.results[parseInt(cb.dataset.importCheck,10)].checked = cb.checked;
      renderImportResults();
    });
  });
  const addCheckedBtn = document.getElementById('add-checked-btn');
  if(addCheckedBtn) addCheckedBtn.addEventListener('click', ()=>{
    importResults.results.filter(r=>r.checked).forEach(r=>{
      state.places.push({
        id: uid(), name: r.name, distance: r.distance,
        price: r.price, health: r.health, lastVisited: null, placeId: r.placeId || null
      });
    });

    importStatus = 'Added to your list.';
    saveState();
    renderPlacesTab();
  });
}

// ---------- Round ----------
let votingStarted = false;
let currentVoterIdx = 0;
let awaitingHandoff = false;
function resetVotingFlow(){ votingStarted = false; currentVoterIdx = 0; awaitingHandoff = false; }
function renderRound(){
  const body = document.getElementById('round-body');
  if(state.places.length < 2){
    body.innerHTML = `
      <div class="card">
        <h3>Let's get started</h3>
        <p class="sub" style="margin-bottom:14px;">1. Pick who's voting on the People tab (Austin &amp; Annahita are already in).<br>2. Add a few spots to choose from &mdash; the fastest way is below.</p>
        <button class="btn" id="round-find-nearby-btn">Find restaurants near me</button>
        <div class="status" id="round-find-status"></div>
      </div>
    `;
    const btn = document.getElementById('round-find-nearby-btn');
    if(btn) btn.addEventListener('click', async ()=>{
      const statusEl = document.getElementById('round-find-status');
      statusEl.classList.remove('error');
      if(!state.settings.homeLat){
        statusEl.textContent = 'Finding your location...';
        try{
          const loc = await locateUser();
          state.settings.homeLat = loc.lat;
          state.settings.homeLng = loc.lng;
          state.settings.homeLabel = 'Current location';
          saveState();
        } catch(err){
          statusEl.textContent = err.message + ' Enter your address on the Spots tab instead.';
          statusEl.classList.add('error');
          switchToTab('places');
          return;
        }
      }
      switchToTab('places');
      showSettings = true;
      renderPlacesTab();
      await findNearbyRestaurants();
    });
    return;
  }
  if(state.people.length === 0){ body.innerHTML = '<div class="empty">Add people on the People tab so they can vote.</div>'; return; }

  const sel = state.round.selectedPeople;

  if(!votingStarted){
    let html = `<h2>Who's in tonight?</h2><p class="sub">Tap everyone voting this round.</p><div class="people-list">`;
    state.people.forEach(p=>{
      const isSel = sel.includes(p.id);
      html += `<div class="person-pill ${isSel?'selected':''}" data-toggle-person="${p.id}"><img class="avatar" src="${avatarForName(p.name)}" alt="">${escapeHtml(p.name)}</div>`;
    });
    html += `</div>`;

    if(sel.length === 0){
      html += `<div class="empty">Pick at least one person to start voting.</div>`;
      body.innerHTML = html;
      attachPersonToggles();
      return;
    }

    html += `<p class="sub" style="margin-top:-6px;">Each person votes privately, one at a time &mdash; hand the phone off when it's their turn. Up to five picks and five vetoes each, none required.</p>`;
    html += `<button class="btn" id="start-voting-btn" style="margin-top:6px;">Start voting</button>`;
    body.innerHTML = html;
    attachPersonToggles();
    document.getElementById('start-voting-btn').addEventListener('click', ()=>{
      votingStarted = true; currentVoterIdx = 0; awaitingHandoff = false;
      renderRound();
    });
    return;
  }

  // Voting is underway — a handoff interstitial or one voter's private ballot at a time.
  if(sel.length === 0){ resetVotingFlow(); renderRound(); return; }
  const person = state.people.find(p=>p.id === sel[currentVoterIdx]);
  if(!person){ resetVotingFlow(); renderRound(); return; }

  if(awaitingHandoff){
    body.innerHTML = `
      <div class="card handoff-card">
        <img class="avatar xl" src="${avatarForName(person.name)}" alt="">
        <h2 style="text-align:center;">Pass the phone to<br>${escapeHtml(person.name)}</h2>
        <p class="sub" style="text-align:center;">No peeking at anyone else's picks.</p>
        <button class="btn" id="handoff-ready-btn" style="margin-top:10px;">I'm ${escapeHtml(person.name)} &mdash; let's go</button>
      </div>
      <a class="back-link" id="cancel-voting-link" style="text-align:center; display:block; margin-top:10px;">&larr; Cancel voting</a>
    `;
    document.getElementById('handoff-ready-btn').addEventListener('click', ()=>{ awaitingHandoff = false; renderRound(); });
    document.getElementById('cancel-voting-link').addEventListener('click', ()=>{ resetVotingFlow(); renderRound(); });
    return;
  }

  const votes = state.round.votes[person.id] || [];
  const vetoes = state.round.vetoes[person.id] || [];
  const isLast = currentVoterIdx === sel.length - 1;
  let html = `<a class="back-link" id="back-to-select-link">&larr; Change who's voting</a>`;
  html += `<div class="voter-progress">VOTER ${currentVoterIdx+1} OF ${sel.length}</div>`;
  html += `<h2 style="display:flex; align-items:center; gap:8px;"><img class="avatar" src="${avatarForName(person.name)}" alt="">${escapeHtml(person.name)}'s picks</h2>`;
  html += `<p class="sub">Up to five votes, up to five vetoes. Private until you hand off.</p>`;
  html += `<div class="card" style="padding:4px 16px;">`;
  const placesByDrive = [...state.places].sort((a,b)=>a.distance-b.distance);
  placesByDrive.forEach(place=>{
    const voteOn = votes.includes(place.id);
    const vetoOn = vetoes.includes(place.id);
    html += `<div class="vote-row">
      <div class="drive-time-lg">${place.distance}<span class="drive-time-unit">min</span></div>
      <div class="spot-name-col" style="text-align:left;">
        <div class="place-name">${escapeHtml(place.name)}</div>
        ${place.placeId ? `<a class="maplink" href="${mapsLinkForPlace(place)}" target="_blank" rel="noopener">View on Google Maps</a>` : ''}
      </div>
      <div class="vote-controls">
        <button class="vbtn ${voteOn?'vote-on':''}" data-vote-person="${person.id}" data-vote-place="${place.id}" title="Vote">&#9733;</button>
        <button class="vbtn ${vetoOn?'veto-on':''}" data-veto-person="${person.id}" data-veto-place="${place.id}" title="Veto">&#10005;</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  html += `<button class="btn" id="voter-done-btn" style="margin-top:14px;">${isLast ? 'Done voting &mdash; Spin!' : `Done &mdash; pass to ${escapeHtml(state.people.find(p=>p.id===sel[currentVoterIdx+1])?.name || 'next')}`}</button>`;
  body.innerHTML = html;
  attachVoteHandlers();
  document.getElementById('back-to-select-link').addEventListener('click', ()=>{ resetVotingFlow(); renderRound(); });
  document.getElementById('voter-done-btn').addEventListener('click', ()=>{
    if(isLast){ doSpin(); }
    else { currentVoterIdx++; awaitingHandoff = true; renderRound(); }
  });
}

function attachPersonToggles(){
  document.querySelectorAll('[data-toggle-person]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.togglePerson;
      const idx = state.round.selectedPeople.indexOf(id);
      if(idx === -1) state.round.selectedPeople.push(id);
      else state.round.selectedPeople.splice(idx,1);
      resetVotingFlow();
      saveState(); renderRound();
    });
  });
}
function attachVoteHandlers(){
  document.querySelectorAll('[data-vote-person]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const pid = btn.dataset.votePerson, placeId = btn.dataset.votePlace;
      const votes = state.round.votes[pid] || [];
      const idx = votes.indexOf(placeId);
      if(idx !== -1){ votes.splice(idx,1); }
      else { if(votes.length >= 5) votes.shift(); votes.push(placeId); }
      state.round.votes[pid] = votes;
      const vetoes = state.round.vetoes[pid] || [];
      const vidx = vetoes.indexOf(placeId);
      if(vidx !== -1) vetoes.splice(vidx,1);
      state.round.vetoes[pid] = vetoes;
      saveState(); renderRound();
    });
  });
  document.querySelectorAll('[data-veto-person]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const pid = btn.dataset.vetoPerson, placeId = btn.dataset.vetoPlace;
      const vetoes = state.round.vetoes[pid] || [];
      const idx = vetoes.indexOf(placeId);
      if(idx !== -1){ vetoes.splice(idx,1); }
      else {
        if(vetoes.length >= 5) vetoes.shift();
        vetoes.push(placeId);
        const votes = state.round.votes[pid] || [];
        const vidx = votes.indexOf(placeId);
        if(vidx !== -1) votes.splice(vidx,1);
        state.round.votes[pid] = votes;
      }
      state.round.vetoes[pid] = vetoes;
      saveState(); renderRound();
    });
  });
}

// ---------- Live "open now" status (checked right before spinning, cached briefly) ----------
let openStatusCache = {}; // placeId -> { openNow, checkedAt }
const OPEN_STATUS_TTL_MS = 20 * 60 * 1000; // re-check after 20 minutes
async function refreshOpenStatus(placeIds){
  const now = Date.now();
  const stale = [...new Set(placeIds)].filter(id=>{
    const c = openStatusCache[id];
    return !c || (now - c.checkedAt) > OPEN_STATUS_TTL_MS;
  });
  if(stale.length === 0) return;
  try{
    const res = await fetch('/api/status?ids=' + encodeURIComponent(stale.join(',')));
    const data = await res.json();
    if(res.ok && data.results){
      Object.entries(data.results).forEach(([id, openNow])=>{
        openStatusCache[id] = { openNow, checkedAt: now };
      });
    }
  } catch(e){ /* best effort — unknown places stay eligible */ }
}
function isKnownClosed(place){
  if(!place.placeId) return false;
  const status = openStatusCache[place.placeId];
  return !!status && status.openNow === false;
}

// ---------- Weighting & Spin ----------
function computeWeights(){
  const vetoedIds = new Set(Object.values(state.round.vetoes).flat());
  const voteCounts = {};
  Object.values(state.round.votes).forEach(list=>{ list.forEach(placeId=>{ voteCounts[placeId] = (voteCounts[placeId]||0) + 1; }); });
  const candidates = state.places.filter(p=>!vetoedIds.has(p.id) && !isKnownClosed(p));
  return candidates.map(place=>{
    let weight = 1;
    weight += (voteCounts[place.id] || 0) * 4;
    if(place.lastVisited){
      const days = Math.floor((Date.now() - new Date(place.lastVisited).getTime()) / 86400000);
      if(days < 7) weight *= 0.15;
      else if(days < 21) weight *= 0.55;
      else if(days > 60) weight *= 1.6;
    } else { weight *= 1.7; }
    weight *= Math.max(0.5, 1.3 - (place.distance / 60));
    weight *= ({light:1.12, moderate:1.0, indulgent:0.92})[place.health] ?? 1.0;
    weight *= ({1:1.05, 2:1.0, 3:0.95})[place.price] ?? 1.0;
    return { place, weight: Math.max(weight, 0.05) };
  });
}
function weightedPick(weighted){
  const total = weighted.reduce((s,w)=>s+w.weight, 0);
  let r = Math.random() * total;
  for(const w of weighted){ r -= w.weight; if(r <= 0) return w.place; }
  return weighted[weighted.length-1].place;
}
function slotLightsRow(){
  return `<div class="slot-lights">${Array.from({length:9}).map(()=>'<span class="slot-light"></span>').join('')}</div>`;
}
async function doSpin(){
  const vetoedIds = new Set(Object.values(state.round.vetoes).flat());
  const idsToCheck = state.places.filter(p=>!vetoedIds.has(p.id) && p.placeId).map(p=>p.placeId);
  if(idsToCheck.length){
    const checkingBody = document.getElementById('round-body');
    checkingBody.innerHTML = `<div class="spin-stage"><div class="slot-frame">${slotLightsRow()}<div class="ticket"><div class="label">checking who's open&hellip;</div><div class="winner-name"><span class="spinner-dot"></span><span class="spinner-dot"></span><span class="spinner-dot"></span></div></div>${slotLightsRow()}</div></div>`;
    await refreshOpenStatus(idsToCheck);
  }
  const weighted = computeWeights();
  if(weighted.length === 0){ alert("Nothing eligible right now — everything's either vetoed or closed. Try again closer to dinnertime, or free up a pick."); resetVotingFlow(); renderRound(); return; }
  const winner = weightedPick(weighted);
  const body = document.getElementById('round-body');
  body.innerHTML = `
    <div class="spin-stage">
      <div class="slot-frame">
        ${slotLightsRow()}
        <div class="ticket">
          <div class="label">&#127920; tonight, you're eating at &#127920;</div>
          <div class="winner-name spinning" id="winner-name">...</div>
          <div class="winner-meta" id="winner-meta"></div>
        </div>
        ${slotLightsRow()}
      </div>
      <div class="spin-actions">
        <button class="btn ghost" id="respin-btn">Spin again</button>
        <button class="btn" id="confirm-btn">Lock it in</button>
      </div>
    </div>
  `;
  const nameEl = document.getElementById('winner-name');
  const names = state.places.map(p=>p.name);
  let ticks = 0;
  const maxTicks = 16;
  const interval = setInterval(()=>{
    nameEl.textContent = names[Math.floor(Math.random()*names.length)];
    ticks++;
    if(ticks >= maxTicks){
      clearInterval(interval);
      nameEl.classList.remove('spinning');
      nameEl.textContent = winner.name;
      const winnerLink = mapsLinkForPlace(winner);
      document.getElementById('winner-meta').innerHTML = `${escapeHtml(guessCategory(winner.name))} · ${winner.distance} min drive` + (winnerLink ? `<br><a class="maplink" href="${winnerLink}" target="_blank" rel="noopener">View on Google Maps</a>` : '');
    }
  }, 80);
  document.getElementById('respin-btn').addEventListener('click', doSpin);
  document.getElementById('confirm-btn').addEventListener('click', ()=>{
    const p = state.places.find(p=>p.id === winner.id);
    if(p) p.lastVisited = new Date().toISOString();
    state.round.votes = {};
    state.round.vetoes = {};
    resetVotingFlow();
    saveState();
    renderRound();
  });
}

// ---------- Footer: refresh & clear spots ----------
document.getElementById('refresh-app-btn').addEventListener('click', ()=>{
  window.location.href = window.location.pathname + '?_=' + Date.now();
});
document.getElementById('clear-spots-btn').addEventListener('click', ()=>{
  if(!confirm('Clear all ' + state.places.length + ' saved spots? Your people and home base stay put — this just empties the spots list so you can start fresh in a new location.')) return;
  state.places = [];
  state.round.votes = {};
  state.round.vetoes = {};
  resetVotingFlow();
  saveState();
  renderRound();
  renderPlacesTab();
});

// ---------- Init ----------
renderRound();
renderPlacesTab();
renderPeopleManage();
</script>
